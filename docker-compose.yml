services:
  postgres:
    image: postgres:16-alpine
    container_name: ayudh-vikas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ayudh
      POSTGRES_PASSWORD: ayudh_dev
      POSTGRES_DB: ayudh_vikas
    ports:
      - "5432:5432"
    volumes:
      - ayudh_pg_data:/var/lib/postgresql/data

volumes:
  ayudh_pg_data:
